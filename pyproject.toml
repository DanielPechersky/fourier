[project]
name = "fourier"
version = "1.0.0"
description = "An interactive visualization of the Fourier transform"
authors = [{ name = "Daniel Pechersky", email = "danny.pechersky@gmail.com" }]
requires-python = "~=3.11.0"
readme = "README.md"
dependencies = ["matplotlib>=3.7.1,<4", "numpy>=1.24.2,<2"]

[dependency-groups]
dev = ["flake8>=6.0.0,<7", "black>=23.3.0,<24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
